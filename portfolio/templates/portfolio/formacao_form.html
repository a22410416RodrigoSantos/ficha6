{% extends "portfolio/base.html" %}

{% block content %}
<h2>{% if editar %}Editar Formação{% else %}Nova Formação{% endif %}</h2>

<form method="post">
    {% csrf_token %}
    <table>
        {{ form.as_table }}
    </table>
    <br>
    <button type="submit">
        {% if editar %}Guardar Alterações{% else %}Criar Formação{% endif %}
    </button>
    <a href="{% url 'formacoes' %}">Cancelar</a>
</form>
{% endblock %}
