{% extends "portfolio/base.html" %}

{% block content %}
<h2>{% if editar %}Editar Licenciatura{% else %}Nova Licenciatura{% endif %}</h2>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    
    <table>
        {{ form.as_table }}
    </table>
    
    <br>
    <button type="submit" style="padding: 10px 20px;">
        {% if editar %}Guardar Alterações{% else %}Criar Licenciatura{% endif %}
    </button>
    
    <a href="{% url 'licenciaturas' %}" style="margin-left: 15px;">Cancelar</a>
</form>
{% endblock %}
